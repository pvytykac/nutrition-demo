spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nutrition_demo
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true

server:
  port: 8080

logging:
  level:
    net.pvytykac.nutrition: DEBUG
