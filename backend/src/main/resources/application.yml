spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nutrition_demo?currentSchema=nutrition
    username: nutrition
    password: nutrition
    driver-class-name: org.postgresql.Driver
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8000/realms/nutrition

server:
  port: 8080

logging:
  level:
    net.pvytykac.nutrition: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: ui
      use-pkce-with-authorization-code-grant: true

cors:
  allowed-origins: http://localhost:9000,http://localhost:8080
