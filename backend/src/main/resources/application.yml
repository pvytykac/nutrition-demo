spring:
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: archive
    runtime:
      flyway-enabled: true
      verification-enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/nutrition_demo?currentSchema=nutrition
    username: nutrition
    password: nutrition
    driver-class-name: org.postgresql.Driver
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  mvc:
    problemdetails:
      enabled: true
# todo: sounds good, doesn't work, this is tripping swagger
#    apiversion:
#      default: 1.0
#      detect-supported: true
#      use:
#        path-segment: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8000/realms/nutrition
server:
  port: 8080
logging:
  level:
    root: WARN
    net.pvytykac.nutrition: DEBUG
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: swagger
      use-pkce-with-authorization-code-grant: true
cors:
  allowed-origins: http://localhost:9000,http://localhost:8080,http://localhost:5173
